{% extends "base.html" %}
{% block title %}{{ note.title }} 수정 | Studylog{% endblock %}
{% block content %}
<div class="layout">
  <section class="panel">
    <a class="back" href="{{ url_for('note_detail', note_id=note.id) }}">목록으로</a>
    <h2>노트 수정</h2>
    <form method="post" action="{{ url_for('edit_note', note_id=note.id) }}" class="note-form">
      <label>강의
        <input name="course" value="{{ note.course }}" placeholder="Claude Code in action">
      </label>
      <label>제목
        <input name="title" required value="{{ note.title }}" placeholder="오늘 배운 한 가지">
      </label>
      <label>내용
        <textarea name="body" rows="5" required placeholder="핵심만 짧게 적어두세요">{{ note.body }}</textarea>
      </label>
      <label>태그 <small>쉼표로 구분</small>
        <input name="tags" value="{{ note.tags|join(', ') }}" placeholder="claudecode, plan mode">
      </label>
      <button type="submit">수정 저장</button>
    </form>
  </section>
</div>
{% endblock %}
