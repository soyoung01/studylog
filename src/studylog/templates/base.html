<!doctype html>
<html lang="ko"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Studylog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Studylog</a>
    <span class="version">v{{ version }}</span>
    <form class="theme-switch" method="post" action="{{ url_for('set_theme') }}">
      <input type="hidden" name="next" value="{{ request.full_path }}">
      <button class="theme-to-dark" type="submit" name="theme" value="dark">다크 모드로 전환</button>
      <button class="theme-to-light" type="submit" name="theme" value="light">라이트 모드로 전환</button>
    </form>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main>{% block content %}{% endblock %}</main>
</body>
</html>
