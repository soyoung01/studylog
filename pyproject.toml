[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studylog"
version = "0.1.0"
description = "강의 노트를 기록하고 태그로 찾아보는 작은 Flask 웹앱"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studylog = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/studylog"]
